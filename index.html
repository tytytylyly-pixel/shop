<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интернет-магазин одежды</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="header__inner">
      <h1 class="logo">Магазинчик</h1>

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Поиск товаров..."
      >

      <button id="authButton" class="auth-button">Войти</button>

      <button id="cartButton" class="cart-button">
        Корзина <span id="cartCount">(0)</span>
      </button>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="main">

    <div class="layout">

      <!-- Панель фильтров -->
      <aside class="filters">
        <h3>Фильтры</h3>

        <div class="filter-group">
          <label for="categoryFilter">Категория</label>
          <select id="categoryFilter">
            <option value="all">Все категории</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Цена</label>
          <div class="price-inputs">
            <input type="number" id="priceMin" placeholder="От" min="0">
            <input type="number" id="priceMax" placeholder="До" min="0">
          </div>
        </div>

        <div class="filter-group">
          <label>Размер</label>
          <div id="sizeFilter" class="size-filter">
            <button class="size-btn" data-size="S">S</button>
            <button class="size-btn" data-size="M">M</button>
            <button class="size-btn" data-size="L">L</button>
            <button class="size-btn" data-size="XL">XL</button>
          </div>
        </div>

        <button id="resetFilters" class="btn btn-secondary">Сбросить фильтры</button>
      </aside>

      <div class="catalog">
        <!-- Место для сообщений: загрузка / ошибка -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Сетка товаров -->
        <div id="productGrid" class="product-grid"></div>
      </div>

    </div>

  </main>

  <!-- Модальное окно карточки товара -->
  <div id="productModal" class="modal hidden">
    <div class="modal__content">
      <button id="closeProductModal" class="modal__close">&times;</button>
      <div id="productModalBody"></div>
    </div>
  </div>

  <!-- Модальное окно корзины -->
  <div id="cartModal" class="modal hidden">
    <div class="modal__content">
      <button id="closeCartModal" class="modal__close">&times;</button>
      <h2>Корзина</h2>
      <div id="cartItems"></div>
      <div class="cart-total">
        Итого: <span id="cartTotal">0</span>
      </div>
    </div>
  </div>

  <!-- Модальное окно регистрации / входа -->
  <div id="authModal" class="modal hidden">
    <div class="modal__content">
      <button id="closeAuthModal" class="modal__close">&times;</button>

      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active">Вход</button>
        <button id="tabRegister" class="auth-tab">Регистрация</button>
      </div>

      <!-- Форма входа -->
      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="example@mail.com">
        <div class="form-error" id="loginEmailError"></div>

        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" placeholder="Введите пароль">
        <div class="form-error" id="loginPasswordError"></div>

        <div class="form-error" id="loginFormError"></div>

        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <!-- Форма регистрации -->
      <form id="registerForm" class="auth-form hidden">
        <label for="registerName">Имя</label>
        <input type="text" id="registerName" placeholder="Как вас зовут">
        <div class="form-error" id="registerNameError"></div>

        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" placeholder="example@mail.com">
        <div class="form-error" id="registerEmailError"></div>

        <label for="registerPassword">Пароль</label>
        <input type="password" id="registerPassword" placeholder="Минимум 6 символов">
        <div class="form-error" id="registerPasswordError"></div>

        <label for="registerPasswordRepeat">Повторите пароль</label>
        <input type="password" id="registerPasswordRepeat" placeholder="Повторите пароль">
        <div class="form-error" id="registerPasswordRepeatError"></div>

        <div class="form-error" id="registerFormError"></div>

        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
